name: Проверка ссылок

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Внутренние ссылки
        run: python scripts/check_links.py

      - name: Внешние ссылки
        run: python scripts/check_links.py --external
        continue-on-error: true
