name: Обновить версии

# Ежедневно подтягиваем живые версии с официальных API и коммитим их.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/refresh_versions.py
      - versions.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Обновить версии
        run: python scripts/refresh_versions.py

      - name: Коммит, если изменилось
        run: |
          if git diff --quiet -- versions.json; then
            echo "Версии не изменились — коммит не нужен."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "chore: автообновление версий ($(date -u +%Y-%m-%d))"
          git push
